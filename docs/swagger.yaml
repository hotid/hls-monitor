          server answered for recently; the rest split them by current state.
        type: integer
      warn:
        type: integer
    type: object
  internal_api.serversNetworkResponse:
    properties:
      from:
        type: number
      servers:
        items:
          $ref: '#/definitions/internal_api.serverSeries'
        type: array
      step:
        type: number
      to:
        type: number
    type: object
  internal_api.slateRequest:
    properties:
      agent_id:
        type: integer
      incident_id:
        type: integer
      name:
        description: |-
          Name of the slate; a picture marked under a name that exists is
          added to that slate, which is how one that moves gets its frames.
        type: string
      own:
        description: |-
          Own marks not a slate but a clip the channel itself plays over and
          over: a stream playing it is left alone from then on. It takes an
          incident of a clip going round (picture_loop, audio_loop), whose
          coded frames the clip is known by.
        type: boolean
      stream_id:
        description: |-
          The picture: the latest look at a stream from a vantage point (the
          server's own by default), or the one kept with an incident.
        type: integer
    type: object
  internal_api.streamCounts:
    properties:
      disabled:
        type: integer
      fail:
        type: integer
      nodata:
        type: integer
      ok:
        type: integer
      total:
        type: integer
      warn:
        type: integer
    type: object
  internal_api.streamDetail:
    properties:
      agent_ids:
        items:
          type: integer
        type: array
      agents:
        items:
          $ref: '#/definitions/internal_api.agentStatus'
        type: array
      created_at:
        type: string
      enabled:
        type: boolean
      headers:
        additionalProperties:
          type: string
        type: object
      id:
        type: integer
      insecure:
        type: boolean
      interval_sec:
        type: number
      level:
        type: string
      max_segments:
        type: integer
      name:
        type: string
      notes:
        type: string
      open_incidents:
        additionalProperties:
          type: integer
        type: object
      picture:
        description: Picture is what the picture and the sound are checked for.
        type: string
      picture_ref:
        allOf:
        - $ref: '#/definitions/github_com_hotid_hls-monitor_internal_store.PictureRef'
        description: |-
          Picture says which look at the stream has a picture to show (see
          /api/v1/streams/{id}/picture); absent when it was never looked at.
      revision:
        type: integer
      status:
        enum:
        - ok
        - warn
        - fail
        - nodata
        - disabled
        type: string
      timeout_sec:
        type: number
      updated_at:
        type: string
      url:
        type: string
      variants:
        items:
          $ref: '#/definitions/internal_api.variantView'
        type: array
    type: object
  internal_api.streamRef:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  internal_api.streamRequest:
    properties:
      agent_ids:
        items:
          type: integer
        type: array
      enabled:
        type: boolean
      headers:
        additionalProperties:
          type: string
        type: object
      insecure:
        type: boolean
      interval_sec:
        type: number
      level:
        enum:
        - playlist
        - header
        - segments
        - container
        type: string
      max_segments:
        type: integer
      name:
        type: string
      notes:
        type: string
      picture:
        description: |-
          Picture: "" to check the picture and the sound, "static" when a
          still picture is what the stream shows, "off" not to look.
        type: string
      timeout_sec:
        type: number
      url:
        type: string
    type: object
  internal_api.streamView:
    properties:
      agent_ids:
        items:
          type: integer
        type: array
      agents:
        items:
          $ref: '#/definitions/internal_api.agentStatus'
        type: array
      created_at:
        type: string
      enabled:
        type: boolean
      headers:
        additionalProperties:
          type: string
        type: object
      id:
        type: integer
      insecure:
        type: boolean
      interval_sec:
        type: number
      level:
        type: string
      max_segments:
        type: integer
      name:
        type: string
      notes:
        type: string
      open_incidents:
        additionalProperties:
          type: integer
        type: object
      picture:
        description: Picture is what the picture and the sound are checked for.
        type: string
      picture_ref:
        allOf:
        - $ref: '#/definitions/github_com_hotid_hls-monitor_internal_store.PictureRef'
        description: |-
          Picture says which look at the stream has a picture to show (see
          /api/v1/streams/{id}/picture); absent when it was never looked at.
      revision:
        type: integer
      status:
        enum:
        - ok
        - warn
        - fail
        - nodata
        - disabled
        type: string
      timeout_sec:
        type: number
      updated_at:
        type: string
      url:
        type: string
    type: object
  internal_api.systemResponse:
    properties:
      checks:
        $ref: '#/definitions/github_com_hotid_hls-monitor_internal_runner.Stats'
      load:
        allOf:
        - $ref: '#/definitions/github_com_hotid_hls-monitor_internal_selfstat.Status'
        description: |-
          Load is the state of the server process, Checks of the checks it
          makes itself, Results of storing what all agents report.
      local_streams:
        type: integer
      metrics:
        $ref: '#/definitions/github_com_hotid_hls-monitor_internal_metrics.Stats'
      metrics_up:
        type: boolean
      public_url:
        type: string
      results:
        $ref: '#/definitions/github_com_hotid_hls-monitor_internal_ingest.Stats'
      storage:
        allOf:
        - $ref: '#/definitions/github_com_hotid_hls-monitor_internal_store.Usage'
        description: Storage is how much room the database and the segment journal
          take.
      time:
        type: string
      version:
        type: string
    type: object
  internal_api.timelineResponse:
    properties:
      from:
        type: number
      step:
        type: number
      streams:
        additionalProperties:
          items:
            items:
              format: float64
              type: number
            type: array
          type: array
        description: |-
          Streams maps a stream ID to [unix seconds, status] points, where the
          status is the worst seen within the step: 0 ok, 1 warning, 2 failure.
          A step without a point had no checks.
        type: object
      to:
        type: number
    type: object
  internal_api.tokenRequest:
    properties:
      name:
        type: string
    type: object
  internal_api.userRequest:
    properties:
      disabled:
        type: boolean
      password:
        type: string
      role:
        enum:
        - admin
        - viewer
        type: string
      username:
        type: string
    type: object
  internal_api.variantView:
    properties:
      active:
        type: boolean
      avg_bandwidth:
        type: integer
      bandwidth:
        type: integer
      codecs:
        type: string
      frame_rate:
        type: number
      group:
        type: string
      id:
        type: integer
      key:
        type: string
      kind:
        enum:
        - master
        - media
        - video
        - audio
        - subtitles
        type: string
      language:
        type: string
      last_seen:
        type: string
      name:
        type: string
      resolution:
        type: string
      states:
        items:
          $ref: '#/definitions/github_com_hotid_hls-monitor_internal_store.VariantState'
        type: array
      stream_id:
        type: integer
      uri:
        type: string
    type: object
  internal_api.watchResponse:
    properties:
      sources:
        items:
          $ref: '#/definitions/internal_api.watchSource'
        type: array
      vantage:
        description: Vantage is the place the sources below are for.
        type: integer
      vantages:
        items:
          $ref: '#/definitions/internal_api.watchVantage'
        type: array
    type: object
  internal_api.watchSource:
    properties:
      address:
        description: |-
          Address is what is requested, for the eye; URL is the path to give
          to the player.
        type: string
      host:
        type: string
      ip:
        type: string
      kind:
        description: 'Kind is what is asked: the stream''s own address or one server.'
        enum:
        - configured
        - server
        type: string
      last_seen:
        type: string
      seen:
        description: |-
          Seen tells that this server answered for this stream lately;
          otherwise it is known from other streams of the same site and may
          not have this one.
        type: boolean
      software:
        type: string
      url:
        type: string
    type: object
  internal_api.watchVantage:
    properties:
      available:
        description: Available tells that it can be used now; otherwise Why says why
          not.
        type: boolean
      id:
        type: integer
      local:
        description: Local is the server itself.
        type: boolean
      name:
        type: string
      why:
        enum:
        - offline
        - too_old
        type: string
    type: object
info:
  contact: {}
  description: HLS stream monitoring. /api/v1 is the web API (session cookie; every
    non-GET request needs an X-Requested-With header), /api/agent/v1 is for remote
    agents, /api/ext/v1 is the read-only API for external monitoring systems (Bearer
    token).
  title: hls-monitor API
  version: "1.0"
paths:
  /api/agent/v1/captures:
    post:
      consumes:
      - application/zip
      description: The body is the capture as a zip archive, the way /api/v1/captures/{id}/archive
        gives it. A capture sent again is taken once.
      parameters:
      - description: Bearer agent key
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "507":
          description: Insufficient Storage
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Take a capture an agent made
      tags:
      - agent
  /api/agent/v1/config:
    get:
      description: Doubles as the agent's heartbeat. Answers 304 when the revision
        passed in the query is still current.
      parameters:
      - description: Bearer agent key
        in: header
        name: Authorization
        required: true
        type: string
      - description: Revision the agent already has
        in: query
        name: revision
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hotid_hls-monitor_internal_agentproto.Config'
        "304":
          description: Not Modified
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: What the agent has to check
      tags:
      - agent
  /api/agent/v1/enroll:
    post:
      consumes:
      - application/json
      description: The token works once. The key is returned only in this response.
      parameters:
      - description: Enrollment token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_hotid_hls-monitor_internal_agentproto.EnrollRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hotid_hls-monitor_internal_agentproto.EnrollResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Exchange an enrollment token for a permanent agent key
      tags:
      - agent
  /api/agent/v1/fetch:
    get:
      description: Held for up to 25 seconds; answers 204 when there was nothing to
        do. An agent keeps several such requests open.
      parameters:
      - description: Bearer agent key
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hotid_hls-monitor_internal_agentproto.FetchRequest'
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Something for the agent to fetch
      tags:
      - agent
  /api/agent/v1/fetch/{id}:
    post:
      description: The body is the body that was fetched; the X-Fetch-Result header
        is base64 of the JSON of a FetchResult.
      parameters:
      - description: Bearer agent key
        in: header
        name: Authorization
        required: true
        type: string
      - description: ID of the fetch request
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: What the agent fetched
      tags:
      - agent
  /api/agent/v1/results:
    post:
      consumes:
      - application/json
      description: 'The body may be gzip-compressed (Content-Encoding: gzip). Results
        for streams not assigned to the agent are rejected.'
      parameters:
      - description: Bearer agent key
        in: header
        name: Authorization
        required: true
        type: string
      - description: Results
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_hotid_hls-monitor_internal_agentproto.ResultsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hotid_hls-monitor_internal_agentproto.ResultsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Deliver check results
      tags:
      - agent
  /api/ext/v1/discovery/agents:
    get:
      parameters:
      - description: Bearer API token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_api.extAgent'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Agents for low-level discovery, with reachability
      tags:
      - external
  /api/ext/v1/discovery/streams:
    get:
      parameters:
      - description: Bearer API token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_api.extStream'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Streams for low-level discovery
      tags:
      - external
  /api/ext/v1/discovery/variants:
    get:
      parameters:
      - description: Bearer API token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_api.extVariant'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Active variants of all streams for low-level discovery
      tags:
      - external
  /api/ext/v1/status:
    get:
      description: 'status_code: 0 ok, 1 warning, 2 failure, 3 no data, -1 disabled.'
      parameters:
      - description: Bearer API token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_api.extStreamStatusDoc'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Current state of all streams
      tags:
      - external
  /api/ext/v1/streams/{id}/status:
    get:
      description: 'status_code: 0 ok, 1 warning, 2 failure, 3 no data, -1 disabled.'
      parameters:
      - description: Bearer API token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Stream ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.extStreamStatusDoc'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Current state of one stream with per-variant metrics
      tags:
      - external
  /api/v1/agents:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_api.agentView'
            type: array
      summary: List agents
      tags:
      - agents
    post:
      consumes:
      - application/json
      description: Returns a one-time enrollment token. It is shown only in this response.
      parameters:
      - description: Agent name
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.agentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_api.enrollment'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Register a remote agent
      tags:
      - agents
  /api/v1/agents/{id}:
    delete:
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Delete a remote agent with everything it reported
      tags:
      - agents
    put:
      consumes:
      - application/json
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: integer
      - description: Agent settings
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.agentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hotid_hls-monitor_internal_store.Agent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Rename an agent or switch it on or off
      tags:
      - agents
  /api/v1/agents/{id}/token:
    post:
      description: 'Invalidates the agent''s current key: the running agent stops
        being accepted until it enrolls again.'
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.enrollment'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Issue a new enrollment token
      tags:
      - agents
  /api/v1/agents/stats:
    get:
      description: 'For the server''s own checks and for every agent: the streams
        it checks by their state as it sees them, the open incidents found from it,
        what its checks download, how many segments it checks a minute and how many
        of them failed, how long a check takes and how late checks start. Rates and
        counts are over the last five minutes. Keyed by agent ID.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.agentStatsResponse'
      security:
      - SessionCookie: []
      summary: What every vantage point is doing
      tags:
      - agents
  /api/v1/aggregate:
    get:
      description: Counts of streams by state, playlist and segment response times
        (average and 95th percentile), errors, stalls, server changes, the total bitrate
        of the streams and the traffic of the checks themselves, as time series.
      parameters:
      - description: Length of the history in seconds (default 3600, max 604800)
        in: query
        name: range
        type: integer
      - description: Number of steps (default 120, max 300)
        in: query
        name: buckets
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.aggregateResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Figures over all streams for the overview charts
      tags:
      - overview
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Sets the session cookie. Every non-GET request to /api/v1 must
        carry an X-Requested-With header.
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hotid_hls-monitor_internal_store.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Sign in
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      responses:
        "204":
          description: No Content
      summary: Sign out
      tags:
      - auth
  /api/v1/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hotid_hls-monitor_internal_store.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Current user
      tags:
      - auth
  /api/v1/auth/password:
    put:
      consumes:
      - application/json
      description: Ends all sessions of the user, including the current one.
      parameters:
      - description: Passwords
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.passwordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Change own password
      tags:
      - auth
  /api/v1/captures:
    get:
      description: A capture is the segment a check suspected, a few before it and
        a few after, with the playlists they came from, what ffprobe says of them
        and a playlist that plays them with no stream to ask. It is made at the first
        suspicion and kept only when an incident came of it (state kept), somebody
        asked for it, or a decoder found fault with its segment (state found). Only
        the server's own checks capture, and only when HLSMON_CAPTURE is set.
      parameters:
      - description: Only the captures of this stream
        in: query
        name: stream
        type: integer
      produces:
      - application/json
      responses:
