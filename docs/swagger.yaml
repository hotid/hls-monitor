      - streams
    put:
      consumes:
      - application/json
      description: Replaces all settings. Checking restarts with a clean state.
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: integer
      - description: Stream settings
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.streamRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.streamView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Change a stream
      tags:
      - streams
  /api/v1/streams/{id}/capture:
    post:
      description: 'The stream is checked at once and the segments of its picture
        are saved whatever the check finds: for what an operator sees or hears before
        the checks do. The capture appears in the list a moment later. At most one
        a minute for a stream.'
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "202":
          description: Accepted
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.apiError'
      security:
      - SessionCookie: []
      summary: Capture the segments of a stream now
      tags:
      - captures
  /api/v1/streams/{id}/check:
    post:
      description: Starts the next local check cycle immediately. Remote agents follow
        their own schedule.
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "202":
          description: Accepted
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Check a stream now
      tags:
      - streams
  /api/v1/streams/{id}/diagnose:
    get:
      description: 'Runs a separate checker from the server itself, or with agent
        set from where that agent stands, apart from the regular checks: nothing it
        finds is stored, raises incidents or reaches the charts. The response is newline-delimited
        JSON, one event per line: "start", then a "cycle" per check with the full
        result, then "end". It lasts until the duration passes or the client disconnects.
        At most three diagnoses run at once.'
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: integer
      - description: 'How deep to check: playlist, header, segments or container (default:
          the stream''s own level)'
        in: query
        name: level
        type: string
      - description: How long to run (default 120, max 600)
        in: query
        name: seconds
        type: integer
      - description: The agent to check from; the server itself by default
        in: query
        name: agent
        type: integer
      produces:
      - application/x-ndjson
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.diagnoseEvent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Check a stream every second and stream what each check finds
      tags:
      - streams
  /api/v1/streams/{id}/disable:
    post:
      description: Open incidents of the stream are closed.
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.streamView'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Stop checking a stream
      tags:
      - streams
  /api/v1/streams/{id}/enable:
    post:
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.streamView'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Resume checking a stream
      tags:
      - streams
  /api/v1/streams/{id}/picture:
    get:
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: integer
      - description: Vantage point; the server's own by default
        in: query
        name: agent
        type: integer
      produces:
      - image/jpeg
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
      security:
      - SessionCookie: []
      summary: The picture of the latest look at a stream
      tags:
      - streams
  /api/v1/streams/{id}/pictures:
    get:
      description: 'One per vantage point: when the stream was looked at, how bright
        the picture was and how loud the sound. The picture itself is at /api/v1/streams/{id}/picture.
        Empty when the picture is not checked (see HLSMON_PICTURE_CHECK).'
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_hotid_hls-monitor_internal_store.StreamPicture'
            type: array
      security:
      - SessionCookie: []
      summary: The latest looks at a stream's picture and sound
      tags:
      - streams
  /api/v1/streams/{id}/segments:
    get:
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: integer
      - description: Only this agent
        in: query
        name: agent
        type: integer
      - description: Only this variant
        in: query
        name: variant
        type: integer
      - description: Only segments with problems
        in: query
        name: problems
        type: boolean
      - description: Only segments checked before this Unix time
        in: query
        name: before
        type: number
      - description: Rows to return (default 100, max 1000)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_hotid_hls-monitor_internal_store.SegmentRecord'
            type: array
      summary: Journal of checked segments, newest first
      tags:
      - streams
  /api/v1/streams/{id}/series:
    get:
      description: Returns one series per agent and variant for each requested metric.
        Each point aggregates the samples of one step.
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: integer
      - description: Comma-separated metric names, e.g. hls_segment_total_seconds
        in: query
        name: metric
        required: true
        type: string
      - description: 'Start, Unix seconds (default: one hour ago)'
        in: query
        name: from
        type: number
      - description: 'End, Unix seconds (default: now)'
        in: query
        name: to
        type: number
      - description: 'Step in seconds (default: range / 300)'
        in: query
        name: step
        type: number
      - description: Aggregation within a step
        enum:
        - avg
        - max
        - min
        - last
        - sum
        in: query
        name: agg
        type: string
      - description: Only this agent
        in: query
        name: agent
        type: integer
      - description: Only this variant
        in: query
        name: variant
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.seriesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Time series of a stream for charts
      tags:
      - streams
  /api/v1/streams/{id}/snapshots:
    get:
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: integer
      - description: Rows to return (default 50, max 500)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_hotid_hls-monitor_internal_store.Snapshot'
            type: array
      summary: Playlists captured when something was wrong, without their text
      tags:
      - streams
  /api/v1/streams/{id}/sources:
    get:
      description: Every server seen within the period, with how often it answered
        and when it was last seen.
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: integer
      - description: How far back to look (default 24, max 720)
        in: query
        name: hours
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_hotid_hls-monitor_internal_store.SourceSeen'
            type: array
      summary: Servers that answered for a stream's playlists and segments
      tags:
      - streams
  /api/v1/streams/{id}/watch:
    get:
      description: 'The stream''s own address, and every server known to answer for
        it or for other streams of the same site, asked directly. Each comes with
        a path that works for twelve hours and serves the playlist with all its addresses
        replaced by such paths: the browser requests everything from the monitor,
        the monitor from the origin.'
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: integer
      - description: 'Watch through this agent: the browser asks the server, the server
          the agent, the agent the origin (default: the server itself)'
        in: query
        name: agent
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.watchResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Ways to watch a stream through the server
      tags:
      - streams
  /api/v1/streams/import:
    post:
      consumes:
      - application/json
      description: Reads an IPTV list (extended M3U, a plain list of addresses, or
        lines of a name and an address) and adds a stream for every address that is
        not checked yet. With dry_run it only tells what would be added.
      parameters:
      - description: The list and the settings of the streams
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.importRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.importResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Add streams from a list of channels
      tags:
      - streams
  /api/v1/system:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.systemResponse'
      summary: Server version and the state of the time series storage
      tags:
      - system
  /api/v1/timeline:
    get:
      description: For every stream, the worst status across agents in each step of
        the range.
      parameters:
      - description: Length of the history in seconds (default 3600, max 604800)
        in: query
        name: range
        type: integer
      - description: Number of steps (default 60, max 240)
        in: query
        name: buckets
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.timelineResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Recent status history of all streams
      tags:
      - overview
  /api/v1/tokens:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_hotid_hls-monitor_internal_store.APIToken'
            type: array
      summary: List API tokens for external monitoring
      tags:
      - tokens
    post:
      consumes:
      - application/json
      description: The token value is shown only in this response.
      parameters:
      - description: Token name
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.tokenRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_api.createdToken'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Create a read-only API token
      tags:
      - tokens
  /api/v1/tokens/{id}:
    delete:
      parameters:
      - description: Token ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Revoke an API token
      tags:
      - tokens
  /api/v1/users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_hotid_hls-monitor_internal_store.User'
            type: array
      summary: List users
      tags:
      - users
    post:
      consumes:
      - application/json
      parameters:
      - description: User
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.userRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_hotid_hls-monitor_internal_store.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Add a user
      tags:
      - users
  /api/v1/users/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Delete a user
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Only the fields present in the body change. A new password or disabling
        ends the user's sessions.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to change
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.userRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hotid_hls-monitor_internal_store.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Change a user's role, password or access
      tags:
      - users
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness check
      tags:
      - system
  /metrics:
    get:
      description: 'Load of the process, the checks it makes, storing of results,
        storage size and the state of every agent with its queue of undelivered results.
        Figures of the monitored streams are not here: see the external monitoring
        API.'
      parameters:
      - description: Bearer API token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: The server's own metrics in the Prometheus text format
      tags:
      - system
  /readyz:
    get:
      description: 'Answers 503 when the database does not respond. An overloaded
        server, checks that fall behind and an unreachable time series storage are
        reported in the body with status "degraded" and code 200: the server still
        works.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.readyAnswer'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_api.readyAnswer'
      summary: 'Readiness: whether the server can do its job'
      tags:
      - system
securityDefinitions:
  BearerToken:
    description: '"Bearer <token>": an API token from the Settings page for /api/ext/v1
      and /metrics, the key of an agent for /api/agent/v1.'
    in: header
    name: Authorization
    type: apiKey
  SessionCookie:
    description: 'The session of the web interface: the hlsmon_session cookie that
      signing in sets. The browser sends it by itself.'
    in: header
    name: Cookie
    type: apiKey
swagger: "2.0"
