definitions:
  github_com_hotid_hls-monitor_internal_agentproto.CaptureJob:
    properties:
      stream_id:
        type: integer
    type: object
  github_com_hotid_hls-monitor_internal_agentproto.Config:
    properties:
      agent_id:
        type: integer
      captures:
        description: |-
          Captures asks the agent to capture the segments around what it
          finds and send the captures worth keeping to /captures.
        type: boolean
      enabled:
        type: boolean
      name:
        type: string
      poll_sec:
        description: PollSec is how often to ask for the configuration again.
        type: integer
      revision:
        description: Revision identifies this exact set of targets.
        type: string
      server_time:
        description: ServerTime is the server's clock in Unix milliseconds.
        type: integer
      slates:
        description: |-
          Slates are the pictures known to be slates, for the looks at the
          streams.
        items:
          $ref: '#/definitions/github_com_hotid_hls-monitor_internal_probe.Slate'
        type: array
      targets:
        items:
          $ref: '#/definitions/github_com_hotid_hls-monitor_internal_probe.Target'
        type: array
    type: object
  github_com_hotid_hls-monitor_internal_agentproto.DiagnoseJob:
    properties:
      seconds:
        type: integer
      target:
        $ref: '#/definitions/github_com_hotid_hls-monitor_internal_probe.Target'
    type: object
  github_com_hotid_hls-monitor_internal_agentproto.EnrollRequest:
    properties:
      token:
        type: string
      version:
        type: string
    type: object
  github_com_hotid_hls-monitor_internal_agentproto.EnrollResponse:
    properties:
      agent_id:
        type: integer
      key:
        type: string
      name:
        type: string
    type: object
  github_com_hotid_hls-monitor_internal_agentproto.FetchRequest:
    properties:
      capture:
        allOf:
        - $ref: '#/definitions/github_com_hotid_hls-monitor_internal_agentproto.CaptureJob'
        description: |-
          Capture is what work of the kind capture is about: a capture of a
          stream at its next check. The answer has Status 202 when one will
          be made, 409 when not.
      diagnose:
        allOf:
        - $ref: '#/definitions/github_com_hotid_hls-monitor_internal_agentproto.DiagnoseJob'
        description: |-
          Diagnose is what work of the kind diagnose is about: nothing is
          fetched for the server, a stream is checked.
      entry:
        description: |-
          Entry marks the stream's own address; Inside tells that it was not
          a public one. The agent applies its own policy on private networks.
        type: boolean
      headers:
        additionalProperties:
          type: string
        description: |-
          Headers are sent only to the site of HeadersFor, the stream's own
          address.
        type: object
      headers_for:
        type: string
      id:
        type: string
      insecure:
        type: boolean
      inside:
        type: boolean
      kind:
        description: |-
          Kind is what is asked. A server older than this field does not
          send it, and the work is told by what came with it: see Work.
        enum:
        - fetch
        - diagnose
        - capture
        type: string
      max_body:
        type: integer
      range_length:
        type: integer
      range_offset:
        description: RangeLength above zero asks for that many bytes from RangeOffset.
        type: integer
      url:
        type: string
    type: object
  github_com_hotid_hls-monitor_internal_agentproto.Link:
    properties:
      failures:
        type: integer
      measured:
        description: |-
          Measured is false where the kernel's figures cannot be read (the
          agent does not run on Linux): RTTMs and Retransmits mean nothing.
        type: boolean
      request_ms:
        description: RequestMs is how long the latest delivery of results took.
        type: number
      requests:
        description: |-
          Requests and Failures count the requests to the server since the
          start and those of them that got no answer.
        type: integer
      retransmits:
        description: |-
          Retransmits counts the TCP segments the agent had to send again
          since it started: loss on the way to the server.
        type: integer
      rtt_ms:
        description: |-
          RTTMs is the round trip time to the server, by the kernel's count on
          the latest request; zero where the agent cannot read it.
        type: number
      segments:
        description: |-
          Segments counts the TCP segments with data the agent sent since it
          started: what Retransmits is a share of. Zero from agents that do
          not tell it.
        type: integer
    type: object
  github_com_hotid_hls-monitor_internal_agentproto.ResultsRequest:
    properties:
      results:
        description: Results has nil in place of a result that could not be read.
        items:
          $ref: '#/definitions/github_com_hotid_hls-monitor_internal_probe.Result'
        type: array
    type: object
  github_com_hotid_hls-monitor_internal_agentproto.ResultsResponse:
    properties:
      accepted:
        type: integer
      duplicates:
        type: integer
      failed:
        type: integer
      rejected:
        type: integer
    type: object
  github_com_hotid_hls-monitor_internal_agentproto.Status:
    properties:
      behind:
        type: integer
      captures:
        description: |-
          Captures tells that the agent captures the segments around what it
          finds when the server asks it to, and sends them.
        type: boolean
      cpu_cores:
        description: 'CPUCores and CPULimit: processors used and available; MemoryBytes.'
        type: number
      cpu_limit:
        type: number
      diagnoses:
        description: |-
          Diagnoses tells that the agent takes requests to check a stream
          every second for a while (see DiagnoseJob); older agents do not.
        type: boolean
      fetches:
        description: |-
          Fetches tells that the agent takes requests to fetch something for
          the server (see FetchRequest); older agents do not.
        type: boolean
      link:
        allOf:
        - $ref: '#/definitions/github_com_hotid_hls-monitor_internal_agentproto.Link'
        description: Link is how the agent's connection to the server is doing.
      memory_bytes:
        type: integer
      overloaded:
        description: Overloaded names what the agent's host is short of, if anything.
        enum:
        - processor
        type: string
      queue_bytes:
        type: integer
      queue_dropped:
        description: |-
          QueueDropped counts the results dropped since the agent started
          because the queue was full.
        type: integer
      queue_failing:
        description: QueueFailing tells that results cannot be written to the queue.
        type: boolean
      queue_oldest_sec:
        type: number
      queue_results:
        description: |-
          QueueResults and QueueBytes describe the results not delivered yet,
          QueueOldestSec how long the oldest of them has been waiting.
        type: integer
      streams:
        description: |-
          Streams is how many streams the agent checks, Behind how many of
          them it checks later than it should.
        type: integer
    type: object
  github_com_hotid_hls-monitor_internal_capture.Capture:
    properties:
      agent_id:
        description: |-
          AgentID is the agent that made it, for a capture an agent sent; 0
          for one the server made itself.
        type: integer
      at:
        type: string
      bytes:
        type: integer
      confirmed:
        items:
          type: string
        type: array
      done:
        description: Done tells that nothing more is being added to it.
        type: boolean
      files:
        items:
          $ref: '#/definitions/github_com_hotid_hls-monitor_internal_capture.File'
        type: array
      id:
        type: string
      kinds:
        description: |-
          Kinds are the problems it was made on suspicion of; Confirmed
          those of them that were then reported. Manual tells that somebody
          asked for it.
        items:
          type: string
        type: array
      manual:
        type: boolean
      notes:
        items:
          type: string
        type: array
      playable:
        description: Playable tells that index.m3u8 in it plays without the stream.
        type: boolean
      seq:
        type: integer
      state:
        enum:
        - pending
        - kept
        - found
        type: string
      stream_id:
        type: integer
      variant:
        type: string
    type: object
  github_com_hotid_hls-monitor_internal_capture.File:
    properties:
      after_detection:
        description: |-
          AfterDetection tells that the file was fetched after the check
          made its finding, by a request of its own: the server may have
          answered differently that time. Evidence is never that.
        type: boolean
      bytes:
        type: integer
      decode_errors:
        type: string
      duration:
        type: number
      error:
        type: string
      fetched_at:
        type: string
      name:
        description: Name is where it is in the capture.
        type: string
      position:
        type: integer
      probe:
        description: |-
          Probe names the file with what ffprobe says of it, DecodeErrors the
          one with what a decoder complained of, when it did.
        type: string
      role:
        description: Role is what it is.
        enum:
        - evidence
        - segment
        - init
        - playlist
        - master
        type: string
      seq:
        description: |-
          Seq and Duration are those of a segment in its playlist; Position
          is where it stands to the one the finding is about: 0, before (<0)
          or after (>0).
        type: integer
      server:
        type: string
      sha256:
        type: string
      software:
        type: string
      status:
        type: integer
      url:
        type: string
      whole:
        description: Whole tells that all of the segment is there, not its beginning.
        type: boolean
    type: object
  github_com_hotid_hls-monitor_internal_capture.Usage:
    properties:
      bytes:
        type: integer
      captures:
        type: integer
      made:
        description: |-
          Made counts the captures made since the start, Refused those that
          were not: too many at a time, or too soon after the one before.
        type: integer
      max_bytes:
        type: integer
      refused:
        type: integer
    type: object
  github_com_hotid_hls-monitor_internal_httpx.Hop:
    properties:
      remote_addr:
        type: string
      server:
        type: string
      status:
        type: integer
      url:
        type: string
    type: object
  github_com_hotid_hls-monitor_internal_ingest.Stats:
    properties:
      failed:
        description: |-
          Failed could not be stored; an agent sends such a result again, a
          result of the server's own checks is lost after a few attempts.
        type: integer
      repeated:
        description: Repeated were refused as delivered before (ErrStale).
        type: integer
      stored:
        type: integer
    type: object
  github_com_hotid_hls-monitor_internal_media.Info:
    properties:
      cc_errors:
        type: integer
      clock:
        allOf:
        - $ref: '#/definitions/github_com_hotid_hls-monitor_internal_media.TSClock'
        description: Clock is what the program clock of the segment says.
      container:
        enum:
        - ts
        - fmp4
        - aac
        - vtt
        - unknown
        type: string
      error:
        description: Error is set when the segment could not be parsed completely.
        type: string
      has_pat:
        type: boolean
      has_pmt:
        type: boolean
      packets:
        description: MPEG-TS specifics.
        type: integer
      scrambled:
        type: boolean
      sync_errors:
        type: integer
      time_wrap:
        description: |-
          TimeWrap is the period in seconds after which timestamps wrap around
          (2^33 / 90000 for MPEG-TS), zero when they do not wrap.
        type: number
      tracks:
        items:
          $ref: '#/definitions/github_com_hotid_hls-monitor_internal_media.Track'
        type: array
      transport_errors:
        type: integer
    type: object
  github_com_hotid_hls-monitor_internal_media.TSClock:
    properties:
      has_lead:
        type: boolean
      max_pat_gap:
        type: number
      max_pcr_gap:
        description: |-
          MaxPCRGap is the longest time between two clock references in a row,
          by the clock. TR 101 290 allows 40 ms, and 100 ms at most.
        type: number
      max_pmt_gap:
        type: number
      min_lead:
        description: |-
          MinLead is the least time by which a frame came before the clock
          reached the moment it is to be decoded at; negative when it came
          late. HasLead tells that it was measured.
        type: number
      pats:
        description: |-
          PATs and PMTs count the tables, MaxPATGap and MaxPMTGap are the
          longest time between two of them by the clock, counting the tail
          after the last one. TR 101 290 allows half a second.
        type: integer
      pcr_jumps:
        description: |-
          PCRJumps counts references that went back or more than a second
          forward with no discontinuity announced.
        type: integer
      pcrs:
        description: |-
          PCRs is how many clock references were read, Span the time between
          the first and the last of them.
        type: integer
      pmts:
        type: integer
      span:
        type: number
    type: object
  github_com_hotid_hls-monitor_internal_media.Track:
    properties:
      bytes:
        type: integer
      channels:
        type: integer
      codec:
        description: Codec is not set when the container does not say.
        type: string
      end_pts:
        type: number
      first_keyframe:
        type: boolean
      fps:
        type: number
      frames:
        type: integer
      has_timing:
        description: HasTiming is false when presentation times could not be determined.
        type: boolean
      height:
        type: integer
      id:
        description: PID for TS, track ID for fMP4
        type: integer
      keyframes:
        type: integer
      kind:
        enum:
        - video
        - audio
        - other
        type: string
      level:
        type: string
      max_gop:
        description: |-
          MaxGOP is the longest distance between keyframes in seconds, counting
          the tail after the last keyframe.
        type: number
      profile:
        type: string
      range:
        description: |-
          Range is the dynamic range of the picture when it is a high one;
          not set for standard.
        enum:
        - PQ
        - HLG
        type: string
      sample_rate:
        type: integer
      start_pts:
        description: |-
          StartPTS and EndPTS are in seconds on the track timeline. EndPTS is the
          presentation end of the last frame.
        type: number
      width:
        type: integer
    type: object
  github_com_hotid_hls-monitor_internal_metrics.Series:
    properties:
      labels:
        additionalProperties:
          type: string
        type: object
      points:
        description: Points are [unix seconds, value] pairs.
        items:
          items:
            format: float64
            type: number
          type: array
        type: array
    type: object
  github_com_hotid_hls-monitor_internal_metrics.Stats:
    properties:
      disk_bytes:
        type: integer
      dropped_batches:
        type: integer
      enabled:
        type: boolean
      queued_bytes:
        description: QueuedBytes wait in memory, DiskBytes (compressed) on disk.
        type: integer
    type: object
  github_com_hotid_hls-monitor_internal_probe.Endpoint:
    properties:
      headers:
        additionalProperties:
          type: string
        description: |-
          Headers are the response headers that identify the server or cache
          node and its software (Server, Via, X-Cache and the like).
        type: object
      host:
        description: Host is the host part of URL, with the port when it is not the
          default.
        type: string
      ip:
        description: IP is the address of the server the connection was made to.
        type: string
      proto:
        type: string
      redirects:
        description: Redirects are the hops followed from the requested URL, in order.
        items:
          $ref: '#/definitions/github_com_hotid_hls-monitor_internal_httpx.Hop'
        type: array
      url:
        description: URL is the address the response finally came from.
        type: string
    type: object
  github_com_hotid_hls-monitor_internal_probe.Metric:
    properties:
      ip:
        type: string
      "n":
        type: string
      s:
        description: |-
          Server and IP name the server a figure is about, for the few that
          describe the way to a server rather than a playlist: the host that
          answered and the address the connection went to.
        type: string
      v:
        type: string
      x:
        type: number
    type: object
  github_com_hotid_hls-monitor_internal_probe.Picture:
    properties:
      audio_db:
        type: number
      cells:
        items:
          type: integer
        type: array
      dark:
        type: number
      has_audio:
        description: AudioDB is the level of the sound in decibels below full scale.
        type: boolean
      has_picture:
        description: |-
          Luma is the mean brightness, 0 to 255; Dark the share of points
          that are all but black.
        type: boolean
      jpeg:
        description: |-
          JPEG is the picture, small; absent when the stream has none. Cells
          is the same shrunk further, to compare pictures by.
        items:
          type: integer
        type: array
      luma:
        type: number
      time:
        type: string
      variant:
        type: string
    type: object
  github_com_hotid_hls-monitor_internal_probe.Problem:
    properties:
      count:
        description: Count is how many times it occurred within the cycle.
        type: integer
      details:
        description: |-
          Details are the figures the conclusion was drawn from: what was
          requested, what came back and what it was compared with.
        type: object
      kind:
        type: string
      message:
        type: string
      severity:
        enum:
        - info
        - warn
        - crit
        type: string
      variant:
        type: string
    type: object
  github_com_hotid_hls-monitor_internal_probe.Result:
    properties:
      metrics:
        items:
          $ref: '#/definitions/github_com_hotid_hls-monitor_internal_probe.Metric'
        type: array
      overloaded:
        description: |-
          Overloaded names what the checking process itself was short of during
          the cycle; empty when it kept up. Findings that rest on timing alone
          are left out of such a result: a monitor that cannot keep up measures
          its own delay, not the stream's.
        enum:
        - processor
        type: string
      own_clip:
        description: |-
          OwnClip names the clip the stream is found to play that is known to
          be the channel's own, and so no fault.
        type: string
      picture:
        allOf:
        - $ref: '#/definitions/github_com_hotid_hls-monitor_internal_probe.Picture'
        description: Picture is what a look at the stream found, in the cycles that
          looked.
      problems:
        items:
          $ref: '#/definitions/github_com_hotid_hls-monitor_internal_probe.Problem'
        type: array
      segments:
        items:
          $ref: '#/definitions/github_com_hotid_hls-monitor_internal_probe.Segment'
        type: array
      snapshots:
        items:
          $ref: '#/definitions/github_com_hotid_hls-monitor_internal_probe.Snapshot'
        type: array
      sources:
        description: Sources tells, per playlist, which servers answered in this cycle.
        items:
          $ref: '#/definitions/github_com_hotid_hls-monitor_internal_probe.Source'
        type: array
      status:
        enum:
        - ok
        - warn
        - fail
        type: string
      statuses:
        description: |-
          Statuses is what the cycle came to for each playlist it has
          something to say of.
        items:
          $ref: '#/definitions/github_com_hotid_hls-monitor_internal_probe.VariantStatus'
        type: array
      target_id:
        type: integer
      time:
        type: string
      variants:
        description: |-
          Variants is the current set of playlists; nil when it could not be
          determined in this cycle (the entry playlist failed).
        items:
          $ref: '#/definitions/github_com_hotid_hls-monitor_internal_probe.Variant'
        type: array
    type: object
  github_com_hotid_hls-monitor_internal_probe.Segment:
    properties:
      bps:
        type: number
      cache:
        enum:
        - hit
        - miss
        type: string
      connect_ms:
        type: number
      discontinuity:
        type: boolean
      dns_ms:
        type: number
      duration:
        type: number
      error:
        type: string
      fetched:
        description: |-
          Fetched is how many bytes were actually downloaded; less than Size
          when only the beginning of the segment was requested.
        type: integer
      media:
        $ref: '#/definitions/github_com_hotid_hls-monitor_internal_media.Info'
      partial:
        type: boolean
      problems:
        items:
          type: string
        type: array
      program_time:
        type: string
      proto:
        type: string
      remote_addr:
        type: string
      seq:
        type: integer
      size:
        type: integer
      source:
        allOf:
        - $ref: '#/definitions/github_com_hotid_hls-monitor_internal_probe.Endpoint'
        description: Source is the server that answered, when a response was received.
      status:
        type: integer
      time:
        type: string
      tls_ms:
        type: number
      total_ms:
        type: number
      ttfb_ms:
        type: number
      url:
        type: string
      variant:
        type: string
    type: object
  github_com_hotid_hls-monitor_internal_probe.Slate:
    properties:
      frames:
        items:
          items:
            format: int32
            type: integer
          type: array
        type: array
      id:
        type: integer
      keys:
        description: |-
          Keys are the coded frames of a clip, sorted: what it is known by
          without decoding anything.
        items:
          type: integer
        type: array
      name:
        type: string
      own:
        description: |-
          Own tells that it is no slate but something a channel itself plays
          over and over: known in order to be left alone.
        type: boolean
    type: object
  github_com_hotid_hls-monitor_internal_probe.Snapshot:
    properties:
      body:
        type: string
      previous:
        description: |-
          Previous is the text the same playlist had at the check before, and
          PreviousTime when it was received; absent when there was none.
        type: string
      previous_time:
        type: string
      url:
        type: string
      variant:
        type: string
    type: object
  github_com_hotid_hls-monitor_internal_probe.Source:
    properties:
      playlist:
        $ref: '#/definitions/github_com_hotid_hls-monitor_internal_probe.Endpoint'
      segment:
        allOf:
        - $ref: '#/definitions/github_com_hotid_hls-monitor_internal_probe.Endpoint'
        description: Segment is the endpoint of the last segment downloaded in the
          cycle.
      variant:
        type: string
    type: object
  github_com_hotid_hls-monitor_internal_probe.Target:
    properties:
      headers:
        additionalProperties:
          type: string
        type: object
      id:
        type: integer
      insecure:
        type: boolean
      interval_sec:
        description: |-
          Interval is the pause between cycles; zero derives it from the
          playlist target duration.
        type: number
      level:
        enum:
        - playlist
        - header
        - segments
        - container
        type: string
      max_segments:
        description: MaxSegments limits segment downloads per variant per cycle; zero
          means 3.
        type: integer
      picture:
        description: Picture says what the picture and the sound are checked for.
        type: string
      revision:
        description: Revision changes whenever the configuration changes.
        type: integer
      timeout_sec:
        description: Timeout bounds a single HTTP request; zero means 10 seconds.
        type: number
      url:
        type: string
    type: object
  github_com_hotid_hls-monitor_internal_probe.Variant:
    properties:
      avg_bandwidth:
        type: integer
      bandwidth:
        type: integer
      codecs:
        type: string
      frame_rate:
        type: number
      group:
        type: string
      key:
        type: string
      kind:
        enum:
        - master
        - media
        - video
        - audio
        - subtitles
        type: string
      language:
        type: string
      name:
        type: string
      resolution:
        type: string
      uri:
        type: string
    type: object
  github_com_hotid_hls-monitor_internal_probe.VariantStatus:
    properties:
      status:
        enum:
        - ok
        - warn
        - fail
        type: string
      variant:
        type: string
    type: object
  github_com_hotid_hls-monitor_internal_runner.Stats:
    properties:
      behind:
        description: |-
          Behind counts the streams whose latest cycle started later than it
          should have by more than its own interval, not counting the time the
          check before it took: a stream that answers slowly makes its own
          checks late, and that is reported as its problem. What is left is
          the runner's: results that wait to be stored, a processor that is
          busy.
        type: integer
      crashed_cycles:
        description: |-
          Crashed counts the cycles that ended in a fault of the checking
          code itself; each is in the log with its stack.
        type: integer
      cycles:
        description: |-
          Cycles counts the cycles made since the start, Unreliable those of
          them made while the process was overloaded.
        type: integer
      lag_max_seconds:
        type: number
      lag_p95_seconds:
        description: |-
          LagP95 and LagMax tell how late cycles start for such reasons, in
          seconds.
        type: number
      running:
        description: Running is how many cycles are being made right now.
        type: integer
      short_cycles:
        description: |-
          Short counts the cycles that started late and therefore looked only
          at the latest segment of each playlist, to catch up.
        type: integer
      streams:
        type: integer
      unreliable_cycles:
        type: integer
    type: object
  github_com_hotid_hls-monitor_internal_selfstat.Status:
    properties:
      cpu_all_cores:
        description: |-
          CPUAllCores is how many processors the whole container used, the
          programs the process runs included (the decoder of pictures is
          one); zero where the container cannot be asked.
        type: number
      cpu_cores:
        description: |-
          CPUCores is how many processors the process used, CPULimit how many
          it may use.
        type: number
      cpu_limit:
        type: number
      cpu_throttled:
        description: |-
          CPUThrottled is how many seconds per second the kernel kept the
          container's processors from it for having used up its quota.
        type: number
      delay_max_seconds:
        type: number
      delay_seconds:
        description: |-
          Delay is how late the process wakes up when it asked to be woken:
          the slowest one in ten wake-ups of the last seconds. DelayMax is the
          slowest of all. Seconds.
        type: number
      goroutines:
        type: integer
      memory_bytes:
        description: |-
          MemoryBytes is the memory of the container when it has a limit,
          otherwise what the process took from the system. MemoryLimit is zero
          when there is none.
        type: integer
      memory_limit_bytes:
        type: integer
      overloaded:
        description: |-
          Overloaded tells that the process did not get the processor time it
          needed; Reason says how that showed.
        type: boolean
      reason:
        enum:
        - processor
        type: string
      scheduler_delay_seconds:
        description: |-
          SchedulerDelay is how long the slowest one in a hundred goroutines
          waited for a processor after becoming ready, in seconds.
        type: number
    type: object
