          schema:
            $ref: '#/definitions/internal_api.apiError'
      security:
      - SessionCookie: []
      summary: A capture as an archive
      tags:
      - captures
  /api/v1/incidents:
    get:
      parameters:
      - description: Only this stream
        in: query
        name: stream
        type: integer
      - description: Only this agent
        in: query
        name: agent
        type: integer
      - description: 'true: only open, false: only closed'
        in: query
        name: open
        type: boolean
      - description: 'true: leave out informational incidents such as a change of
          server'
        in: query
        name: problems
        type: boolean
      - description: 'Only these severities, comma-separated: info, warn, crit'
        in: query
        name: severity
        type: string
      - description: Only incidents still open at or after this Unix time
        in: query
        name: from
        type: number
      - description: Only incidents started before this Unix time
        in: query
        name: to
        type: number
      - description: Rows to return (default 200, max 2000)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_hotid_hls-monitor_internal_store.Incident'
            type: array
      summary: Incidents, open ones first
      tags:
      - incidents
  /api/v1/incidents/{id}/picture:
    get:
      description: 'Kept for incidents found by looking at the picture: a black screen,
        a picture that stopped.'
      parameters:
      - description: Incident ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - image/jpeg
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
      security:
      - SessionCookie: []
      summary: The picture an incident was last seen on
      tags:
      - incidents
  /api/v1/incidents/{id}/scope:
    get:
      description: Which vantage points saw the same problem, and which other streams
        from the same server had it at the same time.
      parameters:
      - description: Incident ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.incidentScope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
      security:
      - SessionCookie: []
      summary: Evidence of where an incident's cause is
      tags:
      - incidents
  /api/v1/overview:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.overviewResponse'
      summary: 'Dashboard data: counters, streams, agents, open incidents'
      tags:
      - overview
  /api/v1/ping:
    get:
      description: 'The player''s page asks this while a stream is watched: how long
        the answer takes is the round trip time between the browser and the server,
        whatever stands in between.'
      responses:
        "204":
          description: No Content
      security:
      - SessionCookie: []
      summary: An empty answer, to time the way to the server by
      tags:
      - watch
  /api/v1/play/{token}:
    get:
      description: Serves what the token names, requested by the server itself. In
        a playlist every address is replaced by such a path. The X-Upstream header
        names the server that answered.
      parameters:
      - description: Token from the list of sources or from a playlist served here
        in: path
        name: token
        required: true
        type: string
      responses:
        "200":
          description: OK
        "206":
          description: Partial Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: A playlist or a segment of a watched stream
      tags:
      - streams
  /api/v1/server-incidents:
    get:
      description: 'What is wrong with a server rather than with one stream: the same
        problem on several of its streams at once (the kind is that of the streams''
        problem), or the way to it losing packets (network_loss). A problem that comes
        back within ten minutes continues the same incident.'
      parameters:
      - description: 'true: only open'
        in: query
        name: open
        type: boolean
      - description: Rows to return (default 200, max 2000)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_hotid_hls-monitor_internal_store.ServerIncident'
            type: array
      security:
      - SessionCookie: []
      summary: Incidents of servers, open ones first
      tags:
      - incidents
  /api/v1/servers:
    get:
      description: Built from the last five minutes of checks. A stream served by
        several servers is counted for each.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_api.serverView'
            type: array
      summary: Servers currently answering, with the state of the streams they serve
      tags:
      - overview
  /api/v1/servers/network:
    get:
      description: By the kernel's count on the connections of the checks, from every
        vantage point together. Loss is the TCP retransmissions per request on the
        way to the server. The streams by state are those the server answered for
        within a step; a stream that several servers answered for is counted at each.
      parameters:
      - description: Length of the history in seconds (default 3600, max 604800)
        in: query
        name: range
        type: integer
      - description: Number of steps (default 120, max 300)
        in: query
        name: buckets
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.serversNetworkResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Round trip time, loss, the share of requests and the streams by state,
        by server
      tags:
      - overview
  /api/v1/slates:
    get:
      description: A slate is what is put on air in place of a channel. A stream showing
        a picture marked as one gets the incident picture_slate at the first look.
        The picture of a frame is at /api/v1/slates/frames/{id}.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_hotid_hls-monitor_internal_store.Slate'
            type: array
      security:
      - SessionCookie: []
      summary: Pictures known to be slates
      tags:
      - slates
    post:
      consumes:
      - application/json
      description: 'A picture is known by what it looks like, to a decoder. A clip
        going round (an incident picture_loop or audio_loop) is known by its coded
        frames as well: a stream playing it again gets picture_slate at the first
        segment, with no decoding — or, marked with own, nothing at all.'
      parameters:
      - description: Which picture, and the name of the slate
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.slateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hotid_hls-monitor_internal_store.Slate'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.apiError'
      security:
      - SessionCookie: []
      summary: Mark a picture or a clip as a slate, or a clip as the channel's own
      tags:
      - slates
  /api/v1/slates/{id}:
    delete:
      parameters:
      - description: Slate ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
      security:
      - SessionCookie: []
      summary: Forget a slate
      tags:
      - slates
  /api/v1/slates/frames/{id}:
    delete:
      description: The slate goes with its last picture.
      parameters:
      - description: Frame ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
      security:
      - SessionCookie: []
      summary: Forget one picture of a slate
      tags:
      - slates
    get:
      parameters:
      - description: Frame ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - image/jpeg
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
      security:
      - SessionCookie: []
      summary: The picture of one frame of a slate
      tags:
      - slates
  /api/v1/snapshots/{id}:
    get:
      parameters:
      - description: Snapshot ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_hotid_hls-monitor_internal_store.Snapshot'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: One captured playlist with its text
      tags:
      - streams
  /api/v1/streams:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_api.streamView'
            type: array
      summary: List streams with their current state
      tags:
      - streams
    post:
      consumes:
      - application/json
      parameters:
      - description: Stream settings
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.streamRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_api.streamView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.apiError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Add a stream
      tags:
      - streams
  /api/v1/streams/{id}:
    delete:
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Delete a stream with its history
      tags:
      - streams
    get:
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.streamDetail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.apiError'
      summary: Stream with variants and their latest metrics
