name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The server embeds the built interface, so it comes first.
      - run: make web
      - run: make vet
      - run: make test
      - run: go test -race ./...

  # Known vulnerabilities in what the code calls. A job of its own: a
  # finding in a dependency is to be seen, not to hold a release back.
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: mkdir -p internal/webui/dist && touch internal/webui/dist/.gitkeep
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # A tag like v1.2.3 publishes ghcr.io/<owner>/hls-monitor-server and
  # hls-monitor-agent as 1.2.3 and latest, for x86-64 and 64-bit ARM.
  images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [server, agent]
    steps:
      - uses: actions/checkout@v5
      # Only the last stage of the image runs on the target architecture.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/hls-monitor-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
